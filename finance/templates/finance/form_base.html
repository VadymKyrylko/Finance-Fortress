{% extends 'finance/base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} | Finance Fortress{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-primary">{{ title }}</h2>

      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}

        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <div class="d-flex justify-content-between mt-4">
          <a href="{{ next|default:request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">
            Скасувати
          </a>

          <button type="submit" class="btn btn-success">{{ btn_text|default:"Зберегти" }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
