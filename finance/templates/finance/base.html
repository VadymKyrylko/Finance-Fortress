<!DOCTYPE html>
{% load static %}
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
      .nav-link:hover {
          text-decoration: underline;
          opacity: 0.8;
      }
  </style>
  <title>{% block title %}Finance Fortress{% endblock %}</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3" href="{% url 'account_list' %}">
      <i class="bi bi-shield-lock-fill"></i>
      Finance Fortress
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item text-light">
          <a class="nav-link text-white fw-bold px-3" href="{% url 'account_list' %}">
            <i class="bi bi-wallet2"></i> My Accounts
          </a>
        </li>
        <li class="nav-item text-light">
          <a class="nav-link text-white fw-bold px-3" href="{% url 'category_list' %}">
            <i class="bi bi-tags"></i> My Categories
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white fw-bold px-3" href="{% url 'analytics' %}">
            <i class="bi bi-pie-chart-fill"></i> Analytics
          </a>
        </li>
        {% if user.is_authenticated %}
        <li class="nav-item d-flex align-items-center text-light me-3">
          <i class="bi bi-person-circle me-2"></i> {{ user.username }}
        </li>
        <li class="nav-item">
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-light fw-bold text-primary btn-sm">
              <i class="bi bi-box-arrow-right"></i> Logout
            </button>
          </form>
        </li>
        {% else %}
        <li class="nav-item">
          <a class="btn btn-light fw-bold text-primary me-2" href="{% url 'login' %}">Login</a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}
  {% endblock %}
</div>

</body>
</html>
