{% extends "finance/base.html" %}

{% block title %}Delete Category | Finance Fortress{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow border-danger">
      <div class="card-header bg-danger text-white d-flex align-items-center">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <strong>Confirmation required</strong>
      </div>
      <div class="card-body text-center p-4">
        <h4 class="mb-3 text-secondary">Are you sure you want to delete this category?</h4>

        <p class="text-danger small">
          <i class="bi bi-info-circle mb-3"></i>
          This action will delete chosen category: <strong>{{ category.name }}</strong>.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="{% url 'category_list' %}" class="btn btn-secondary">
              Cancel
            </a>
            <button type="submit" class="btn btn-danger">
              <i class="bi bi-trash"></i> Yes, delete it
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
