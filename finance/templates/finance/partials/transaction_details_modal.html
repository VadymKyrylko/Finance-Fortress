<div class="modal fade" tabindex="-1" id="transactionModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-light">
        <h5 class="modal-title">
          <i class="bi bi-calendar3"></i> {{ selected_date }}
          <br>
          <small class="text-muted fs-6">{{ category.name }}</small>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-0">
        <div class="list-group list-group-flush">
          {% for t in transactions %}
          <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <div class="fw-bold text-danger">-{{ t.amount }} {{ t.account.currency }}</div>
              <small class="text-muted">
                <i class="bi bi-wallet2"></i> {{ t.account.name }}
                {% if t.description %} | {{ t.description|truncatechars:20 }}{% endif %}
              </small>
            </div>
            <div class="btn-group">
              <a href="{% url 'transaction_update' t.pk %}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-pencil"></i>
              </a>
              <a href="{% url 'transaction_delete' t.pk %}" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash"></i>
              </a>
            </div>
          </div>
          {% empty %}
          <div class="p-3 text-center text-muted">No transactions found.</div>
          {% endfor %}
        </div>
      </div>

      <div class="modal-footer">
        <a href="{% url 'expense_create' %}?date={{ selected_date }}&category={{ category.id }}&next={% url 'calendar' %}"
           class="btn btn-success btn-sm">
          <i class="bi bi-plus-circle"></i> Add another transaction
        </a>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
